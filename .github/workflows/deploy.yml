name: Build DMG & Deploy to Firebase

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches: [main]

concurrency:
  group: aura-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Test update policy
        run: |
          swiftc -parse-as-library AuraApp/UpdateManifest.swift AuraApp/UpdateChecker.swift Tests/test_updates.swift -o /tmp/test-updates
          /tmp/test-updates

      - name: Build macOS App & DMG
        run: |
          chmod +x install.sh
          CI=true ./install.sh

      - name: Inject Version and Copy DMG to Website Assets
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')
          echo "Injecting version $VERSION into web files..."
          sed -i '' "s/__AURA_VERSION__/$VERSION/g" website/public/app.js
          sed -i '' "s/__AURA_VERSION__/$VERSION/g" website/public/index.html
          
          mkdir -p website/public/assets
          cp Aura.dmg website/public/assets/Aura.dmg
          cp version.json website/public/version.json
          python3 scripts/verify_release.py
          echo "✓ Aura.dmg and version $VERSION injected and copied successfully."

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aura-release
          path: |
            Aura.dmg
            version.json

      - name: Set up Node.js
        if: github.event_name == 'push'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        if: github.event_name == 'push'
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting & Firestore
        if: github.event_name == 'push'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is missing! Please configure it in your GitHub repository secrets."
            exit 1
          fi
          firebase deploy --only hosting,firestore --token "$FIREBASE_TOKEN" --non-interactive
