name: Prepare reviewed Aura update-check patch
on:
  push:
    branches: ['feat/update-check']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hash-verified reviewed source
        run: |
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          payload = json.loads(r'''{"AuraApp/Info.plist": {"data": "", "sha256": "e3bedc578d40962b36815df202b3f5bbe62ce70681096a5b1f90a3a240a14bb6"}, "AuraApp/MusicDashboardApp.swift": {"data": "", "sha256": "cbf73843c0e1633aef834a2a27ec4f9c16dd709b5449d5f1afaeec568f0e5008"}, "README.md": {"data": "", "sha256": "a9d44fb155aa7eb783d7108ab67209851cfc70f90c53f098910fa8b112fcab1e"}, "firebase.json": {"data": "", "sha256": "fbed1c79329285f0b02715533364d236ac6a9cc4a4c0841bb7d4eb2d444821f2"}, "install.sh": {"data": "", "sha256": "031bf2733e2a816ead7e24af5ab89c62ad1dbcd6f30a81b20fedcb328a1eab3a"}, "AuraApp/UpdateManifest.swift": {"data": "", "sha256": "3505b1dc54894f94ac327b118cb3abb9f36b763d19bd45b120c7bc99e7d3d4d2"}, "AuraApp/UpdateChecker.swift": {"data": "", "sha256": "0702c5ae8d552d7b3149cc693987a8f3bff3bc118a1bbcf42611a9ca91a2f558"}, "Tests/test_updates.swift": {"data": "", "sha256": "4e4bd0312262b3572481538fa12586f48ec0b4a013945af735a7bb15d6e20797"}, "scripts/release_manifest.py": {"data": "", "sha256": "32270273908dfa2bbd50fbe465ec0ad43e9ffb4d21d56b245fe9a32958e28bc6"}, "scripts/verify_release.py": {"data": "", "sha256": "c997534181bdd85e75ff7e97f14bd23e4aa74f1d9b4f9911e5856f793d790d9b"}}''')
          for name, item in payload.items():
              data = base64.b64decode(item['data'])
              assert hashlib.sha256(data).hexdigest() == item['sha256']
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          PY
      - name: Remove staging and commit scoped patch
        run: |
          git restore .github/workflows/prepare-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AuraApp Tests scripts install.sh firebase.json README.md
          git commit -m "feat: add private lightweight update checks and matched release manifest"
          git push origin HEAD:feat/update-check
